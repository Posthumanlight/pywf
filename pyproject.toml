[project]
name = "pywf"
version = "0.0.1"
description = "\"AI players for TTRPG\""
authors = [
    {name = "Posthumanlight",email = "bcarolin20@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12, <4.0.0"
dependencies = [
    "langchain (>=1.4.3,<2.0.0)",
    "langgraph (>=1.2.12,<2.0.0)",
    "sqlite-vec (>=0.1.9,<0.2.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "numpy (>=2.5.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
